<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quick Reads</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,500&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/reader.css" />
</head>
<body>

  <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>

  <nav class="nav">
    <a class="nav__brand" href="index.html">
      <span class="nav__brand-mark"><span></span><span></span><span></span></span>
      <span class="nav__wordmark">Quick Reads</span>
    </a>
    <div class="nav__links">
      <a href="index.html">&larr; Library</a>
    </div>
  </nav>

  <div class="signal-divider" role="presentation">
    <span class="signal-divider__ticks"><span></span><span></span><span></span><span></span><span></span></span>
  </div>

  <header class="reader-header" id="reader-header"></header>

  <nav class="chapter-list" id="chapter-list" aria-label="Chapters"></nav>

  <main class="chapter" id="chapter">
    <p class="loading-state">Loading&hellip;</p>
  </main>

  <nav class="chapter-nav" id="chapter-nav" aria-label="Chapter navigation"></nav>

  <footer class="site-footer">
    <span>Quick Reads</span>
    <a href="https://github.com/" target="_blank" rel="noopener">GitHub &#8599;</a>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="js/reader.js"></script>

</html>
